<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ordem de Serviço - Gestão de Facilities</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --border-color: #bdc3c7;
            --bg-color: #f8f9fa;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        h2 {
            color: var(--primary-color);
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 10px;
            margin-top: 0;
        }

        /* Menu de Acesso Rápido / Botões da Tela Principal */
        .quick-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 25px;
            background: #ecf0f1;
            padding: 15px;
            border-radius: 6px;
        }

        .btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: #2980b9;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group.full-width {
            grid-column: span 2;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 13px;
            color: var(--primary-color);
        }

        input, select, textarea {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }

        textarea {
            resize: vertical;
            height: 80px;
        }

        /* Seção de Fotos Antes e Depois */
        .photo-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
            border-top: 1px dashed var(--border-color);
            padding-top: 20px;
        }

        .photo-box {
            border: 2px dashed var(--border-color);
            padding: 15px;
            text-align: center;
            border-radius: 6px;
            background: #fafafa;
        }

        .photo-box label {
            cursor: pointer;
            color: var(--accent-color);
            display: inline-block;
            margin-top: 10px;
            padding: 6px 12px;
            background: #fff;
            border: 1px solid var(--accent-color);
            border-radius: 4px;
        }

        .photo-preview {
            width: 100%;
            max-height: 150px;
            object-fit: contain;
            margin-top: 10px;
            display: none;
            border: 1px solid #ddd;
        }

        .action-footer {
            margin-top: 30px;
            text-align: right;
        }

        .btn-print {
            background-color: #27ae60;
        }
        .btn-print:hover {
            background-color: #219653;
        }

        /* Estilização para Impressão em Folha A4 */
        @media print {
            body {
                background: none;
                padding: 0;
            }
            .container {
                width: 210mm;
                min-height: 297mm;
                max-width: none;
                box-shadow: none;
                margin: 0;
                padding: 15mm;
                box-sizing: border-box;
            }
            .quick-actions, .action-footer, .no-print {
                display: none !important;
            }
            input, select, textarea {
                border: none;
                border-bottom: 1px solid #000;
                padding: 4px 0;
                background: transparent;
            }
            .photo-box {
                height: 180px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Ordem de Serviço - Facilities</h2>

    <!-- Botões da Tela Principal solicitados -->
    <div class="quick-actions">
        <button class="btn" onclick="alert('Abrir modal: Cadastro de Fornecedor')">➕ Cadastrar Fornecedor</button>
        <button class="btn" onclick="alert('Abrir modal: Itens de Manutenção')">➕ Itens de Manutenção</button>
        <button class="btn" onclick="alert('Abrir modal: Cadastro de Área')">➕ Cadastrar Área</button>
    </div>

    <form id="osForm">
        <div class="form-grid">
            <div class="form-group full-width">
                <label>Título da tarefa *</label>
                <input type="text" placeholder="Ex.: Verificar bomba" required>
            </div>

            <div class="form-group">
                <label>Área *</label>
                <select required>
                    <option value="">Selecione a área</option>
                    <option value="Portaria">Portaria</option>
                    <option value="Manutencao">Manutenção</option>
                </select>
            </div>

            <div class="form-group">
                <label>Item de manutenção *</label>
                <select required>
                    <option value="">Selecione o item</option>
                    <option value="Eletrica">Elétrica</option>
                    <option value="Hidraulica">Hidráulica</option>
                </select>
            </div>

            <div class="form-group">
                <label>Local / setor</label>
                <input type="text" placeholder="Ex.: Casa de bombas">
            </div>

            <div class="form-group">
                <label>Fornecedor</label>
                <select>
                    <option value="">Selecione o fornecedor</option>
                    <option value="FornecedorA">Fornecedor A</option>
                </select>
            </div>

            <div class="form-group">
                <label>Tipo</label>
                <select>
                    <option value="Preventiva">Preventiva</option>
                    <option value="Corretiva">Corretiva</option>
                </select>
            </div>

            <div class="form-group">
                <label>Prioridade</label>
                <select>
                    <option value="Media">Média</option>
                    <option value="Alta">Alta</option>
                    <option value="Baixa">Baixa</option>
                </select>
            </div>

            <div class="form-group">
                <label>Qtd. de Dias para Conclusão</label>
                <input type="number" min="1" placeholder="Ex.: 3">
            </div>

            <div class="form-group">
                <label>Data de Finalização</label>
                <input type="date">
            </div>

            <div class="form-group">
                <label>Responsável</label>
                <input type="text" value="Gestão de Facilities">
            </div>

            <div class="form-group">
                <label>Periodicidade</label>
                <select>
                    <option value="Unica">Única</option>
                    <option value="Mensal">Mensal</option>
                </select>
            </div>

            <div class="form-group full-width">
                <label>Checklist</label>
                <textarea placeholder="Digite os itens separados por ponto e vírgula. Ex.: verificar funcionamento; verificar vazamentos; testar equipamento"></textarea>
            </div>
        </div>

        <!-- Seção de Fotos: Antes e Depois com acesso à câmera do celular -->
        <div class="photo-section">
            <div class="photo-box">
                <label>📸 Foto Antes (Câmera / Galeria)</label>
                <input type="file" accept="image/*" capture="environment" style="display:none;" id="fotoAntes" onchange="previewImage(this, 'previewAntes')">
                <br><label for="fotoAntes" class="no-print" style="margin-top:10px; background:var(--accent-color); color:#fff; padding:6px 12px; border-radius:4px; border:none;">Tirar / Enviar Foto</label>
                <img id="previewAntes" class="photo-preview" alt="Pré-visualização Antes">
            </div>

            <div class="photo-box">
                <label>📸 Foto Depois (Câmera / Galeria)</label>
                <input type="file" accept="image/*" capture="environment" style="display:none;" id="fotoDepois" onchange="previewImage(this, 'previewDepois')">
                <br><label for="fotoDepois" class="no-print" style="margin-top:10px; background:var(--accent-color); color:#fff; padding:6px 12px; border-radius:4px; border:none;">Tirar / Enviar Foto</label>
                <img id="previewDepois" class="photo-preview" alt="Pré-visualização Depois">
            </div>
        </div>

        <div class="action-footer">
            <button type="button" class="btn btn-print" onclick="window.print()">🖨️ Imprimir OS (A4)</button>
        </div>
    </form>
</div>

<script>
    function previewImage(input, previewId) {
        const preview = document.getElementById(previewId);
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                preview.src = e.target.result;
                preview.style.display = 'block';
            }
            reader.readAsDataURL(input.files[0]);
        }
    }
</script>

</body>
</html>
